[project]
name = "nico-wrapper"
version = "1.1.1"
description = "A thin wrapper around NiCo adding an easy to use public API and command line tools to execute the NiCo pipeline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alexander Dallmann", email = "alexander.dallmann@uni-wuerzburg.de" }
]
maintainers = [
    { name = "Alexander Dallmann", email = "alexander.dallmann@uni-wuerzburg.de" },
    { name = "Christian Eger", email = "christian.eger@uni-wuerzburg.de" },
]
requires-python = ">=3.12,<3.13"
keywords = [
    "bioinformatics",
    "nico",
    "single-cell",
    "spatial-transcriptomics",
    "xenium",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "nico-sc-sp==1.8.0",
    "anndata>=0.13.1",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scanpy==1.12.4",
    "scipy==1.18.1",
    "typer>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/gruenlab/nico-wrapper"
Repository = "https://github.com/gruenlab/nico-wrapper"
Documentation = "https://github.com/gruenlab/nico-wrapper/tree/main/docs"
Issues = "https://github.com/gruenlab/nico-wrapper/issues"

[project.scripts]
nico-wrapper = "nico_wrapper.cli:app"
nico-preprocess = "nico_wrapper.preprocess.cli:app"
nico-transfer = "nico_wrapper.transfer.cli:app"
nico-niche = "nico_wrapper.niche.cli:app"
nico-covariation = "nico_wrapper.covariation.cli:app"


[tool.hatch.build]
skip-excluded-dirs = true
exclude = [
    "**/__pycache__",
    "*.h5ad",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "docs",
    "README.md",
    "LICENSE",
    "CONTRIBUTORS.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.sdist.force-include]
"resources/NiCoLRdb.txt" = "resources/NiCoLRdb.txt"

[tool.hatch.build.targets.wheel]
packages = ["src/nico_wrapper"]

[tool.hatch.build.targets.wheel.force-include]
"resources/NiCoLRdb.txt" = "nico_wrapper/resources/NiCoLRdb.txt"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
