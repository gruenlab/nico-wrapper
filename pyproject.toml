[project]
name = "nico-wrapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexander Dallmann", email = "alexander.dallmann@uni-wuerzburg.de" }
]
requires-python = ">=3.11,<3.12"

dependencies = [
    "nico-sc-sp==1.6.0",
    # pin package versions indepedent of nico
    "scanpy==1.11.2",
    "seaborn==0.13.2",
    "scipy==1.11.3",
    "matplotlib==3.10.3",
    "numpy==1.26.1",
    "networkx==3.2.1",
    "gseapy==1.1.4",
    "numba==0.58.1",
    "xlsxwriter==3.1.9",
    "pydot==1.4.2",
    "scikit-learn==1.3.2",
    "pandas==2.1.1",
    "kdepy==1.1.8",
    "leidenalg>=0.10.2",
    "jupyterlab>=4.4.2",
    "ipykernel>=6.29.5",
    "typer>=0.15.0",
    "pygraphviz>=1.14",
    "llvmlite>=0.41.1",
]

[project.scripts]
nico-preprocess = "nico_wrapper.preprocess.cli:app"
nico-transfer = "nico_wrapper.transfer.cli:app"
nico-niche = "nico_wrapper.niche.cli:app"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
